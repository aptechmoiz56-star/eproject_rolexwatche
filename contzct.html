
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Rolex Luxury</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- Paste common navigation here -->

<section class="hero text-center">
  <h1>Contact Us</h1>
  <p>We would love to hear from you.</p>
</section>

<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <form class="watch-card p-4" id="contactForm">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control mb-3" required>

          <label class="form-label">Email</label>
          <input type="email" class="form-control mb-3" required>

          <label class="form-label">Message</label>
          <textarea class="form-control mb-3" rows="5" required></textarea>

          <button type="submit" class="btn btn-gold">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </div>
</section>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Thank you for contacting us!");
  this.reset();
});
</script>

<!-- Paste common footer here -->
</body>
</html>
